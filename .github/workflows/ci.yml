name: Software Quality & Automated Test Suite

on:
  push:
    branches:
      - main
      - master
      - 'feat/**'
  pull_request:
    branches:
      - main
      - master

jobs:
  python-test-matrix:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies & Test Tools
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8
          pip install -e .

      - name: Lint Code with Flake8 (Syntax & Error Checking)
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 pynq_oscilloscope/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Cloud Unit Test Matrix (Pytest)
        run: |
          pytest tests/ -v